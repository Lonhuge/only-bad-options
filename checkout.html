<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONLY BAD OPTIONS — Checkout</title>
<style>
  @font-face{font-family:"Sequel 100 Black";src:url("fonts/Sequel100Black.woff2") format("woff2"),url("fonts/Sequel100Black.woff") format("woff");font-weight:900;font-display:swap}
  :root{
    --bg:#fff;--panel:#f4f3ef;--ink:#0d0d0d;--muted:#6d6d66;
    --line:rgba(0,0,0,.13);--line-strong:rgba(0,0,0,.30);--accent:#ff2e88;--maxw:1080px;
    --display:"Sequel 100 Black","Arial Black","Helvetica Neue",Impact,sans-serif;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;font-size:15px}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px}

  .announce{background:#000;color:#fff;text-align:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px}
  header{border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;height:70px}
  .logo-img{height:50px;width:auto}
  .secure{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

  h1.title{font-family:var(--display);text-transform:uppercase;font-size:clamp(24px,4vw,38px);letter-spacing:-.01em;margin:26px 0 20px}

  .grid{display:grid;grid-template-columns:1.3fr .9fr;gap:26px;align-items:start;margin-bottom:60px}

  /* form */
  form{border:1px solid var(--ink)}
  .sect{padding:22px 22px 24px;border-bottom:1px solid var(--ink)}
  .sect:last-child{border-bottom:0}
  .sect h2{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
  .row{display:grid;gap:12px;margin-bottom:12px}
  .row.two{grid-template-columns:1fr 1fr}
  .row.plz{grid-template-columns:.5fr 1fr}
  .row:last-child{margin-bottom:0}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .field input,.field select{
    font-family:var(--sans);font-size:14px;color:var(--ink);background:#fff;
    border:1px solid var(--ink);padding:11px 12px;outline:none;border-radius:0;width:100%;
    transition:box-shadow .12s}
  .field input:focus,.field select:focus{box-shadow:inset 0 0 0 1px var(--ink)}
  .field input::placeholder{color:#b1b1a9}
  .field.err input,.field.err select{box-shadow:inset 0 0 0 1px var(--accent);border-color:var(--accent)}

  /* summary */
  .summary{border:1px solid var(--ink);position:sticky;top:20px}
  .summary h2{font-family:var(--display);text-transform:uppercase;font-size:18px;padding:18px 20px;border-bottom:1px solid var(--ink)}
  .sitems{padding:6px 20px}
  .sitem{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .sitem:last-child{border-bottom:0}
  .sth{width:46px;height:46px;border:1px solid var(--ink);display:grid;place-items:center;padding:5px;background:#fff}
  .sth img{max-width:100%;max-height:100%;object-fit:contain}
  .sname{font-family:var(--display);text-transform:uppercase;font-size:12px;line-height:1.05}
  .ssize{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .sqty{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
  .sprice{font-family:var(--mono);font-size:12px;white-space:nowrap}
  .totals{padding:16px 20px;border-top:1px solid var(--ink)}
  .trow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;margin-bottom:8px}
  .trow.grand{font-size:16px;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
  .trow .muted{color:var(--muted)}
  .paybtn{width:100%;background:var(--ink);color:#fff;border:0;padding:17px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .15s;margin-top:16px}
  .paybtn:hover:not(:disabled){background:var(--accent)}
  .paybtn:disabled{opacity:.6;cursor:not-allowed}
  .paynote{font-family:var(--mono);font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:12px}
  .formerr{display:none;font-family:var(--mono);font-size:11px;color:#fff;background:var(--accent);padding:11px 14px;margin:0 20px 4px}
  .back{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:inline-block;margin-bottom:14px}
  .back:hover{color:#000}
  .empty{border:1px solid var(--ink);padding:60px 24px;text-align:center;font-family:var(--mono);font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
  .empty a{color:var(--ink);text-decoration:underline}

  @media(max-width:820px){ .grid{grid-template-columns:1fr} .summary{position:static;order:-1} }
  @media(max-width:520px){ .row.two{grid-template-columns:1fr}
    .announce{padding:7px 14px;font-size:9.5px;letter-spacing:.03em} .bar{height:52px} .logo-img{height:36px} }
</style>
</head>
<body>

<div class="announce">Sichere Zahlung über SumUp · Versand mit DHL aus Köln</div>
<header>
  <div class="wrap bar">
    <a href="index.html"><img class="logo-img" src="images/logo.png" alt="Only Bad Options"></a>
    <span class="secure">🔒 SSL · Sichere Zahlung</span>
  </div>
</header>

<main class="wrap">
  <a class="back" href="index.html#shop">← weiter shoppen</a>
  <h1 class="title">Checkout</h1>
  <div id="root"></div>
</main>

<script src="cart.js"></script>
<script>
(function(){
  const cart = OBOCart.get();
  const CAT = OBOCart.cat, SHIP = OBOCart.ship, EUR = n => n.toFixed(2).replace('.',',')+' €';
  const EU = new Set(["AT","BE","BG","HR","CY","CZ","DK","EE","FI","FR","GR","HU","IE","IT","LV","LT","LU","MT","NL","PL","PT","RO","SK","SI","ES","SE"]);
  const COUNTRIES = [["DE","Deutschland"],["AT","Österreich"],["BE","Belgien"],["BG","Bulgarien"],["HR","Kroatien"],["CY","Zypern"],["CZ","Tschechien"],["DK","Dänemark"],["EE","Estland"],["FI","Finnland"],["FR","Frankreich"],["GR","Griechenland"],["HU","Ungarn"],["IE","Irland"],["IT","Italien"],["LV","Lettland"],["LT","Litauen"],["LU","Luxemburg"],["MT","Malta"],["NL","Niederlande"],["PL","Polen"],["PT","Portugal"],["RO","Rumänien"],["SK","Slowakei"],["SI","Slowenien"],["ES","Spanien"],["SE","Schweden"]];
  const feeFor = c => c==="DE" ? SHIP.de : (EU.has(c) ? SHIP.eu : null);
  const itemsTotal = cart.reduce((s,i)=> s + (CAT[i.id]?CAT[i.id].price:0)*i.qty, 0);
  const needsShip = cart.some(i => !(CAT[i.id] && CAT[i.id].noShip));

  const root = document.getElementById('root');
  if(!cart.length){ root.innerHTML = '<div class="empty">Dein Warenkorb ist leer.<br><br><a href="index.html#shop">← zum Shop</a></div>'; return; }

  root.innerHTML = `
  <div class="grid">
    <form id="co" novalidate>
      <div class="sect">
        <h2>Kontakt</h2>
        <div class="row two">
          <div class="field"><label>E-Mail *</label><input type="email" name="email" placeholder="deine@email.de" autocomplete="email"></div>
          <div class="field"><label>Telefon (für DHL)</label><input type="tel" name="phone" placeholder="+49 …" autocomplete="tel"></div>
        </div>
      </div>
      <div class="sect">
        <h2>Lieferadresse</h2>
        <div class="row two">
          <div class="field"><label>Vorname *</label><input name="firstName" autocomplete="given-name"></div>
          <div class="field"><label>Nachname *</label><input name="lastName" autocomplete="family-name"></div>
        </div>
        <div class="row"><div class="field"><label>Straße & Hausnummer *</label><input name="street" autocomplete="address-line1"></div></div>
        <div class="row"><div class="field"><label>Adresszusatz (optional)</label><input name="zusatz" autocomplete="address-line2" placeholder="Wohnung, c/o, Packstation …"></div></div>
        <div class="row plz">
          <div class="field"><label>PLZ *</label><input name="plz" autocomplete="postal-code"></div>
          <div class="field"><label>Ort *</label><input name="city" autocomplete="address-level2"></div>
        </div>
        <div class="row"><div class="field"><label>Land *</label><select name="country">${COUNTRIES.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div></div>
      </div>
    </form>

    <div class="summary">
      <h2>Bestellung</h2>
      <div class="sitems">${cart.map(i=>{const p=CAT[i.id]||{name:i.id,price:0,img:''};return `
        <div class="sitem"><div class="sth"><img src="${p.img}" alt=""></div>
        <div><div class="sname">${p.name}</div>${i.size?`<div class="ssize">${i.size}</div>`:''}<div class="sqty">Menge: ${i.qty}</div></div>
        <div class="sprice">${EUR(p.price*i.qty)}</div></div>`;}).join('')}</div>
      <div class="formerr" id="formerr"></div>
      <div class="totals">
        <div class="trow"><span class="muted">Zwischensumme</span><span>${EUR(itemsTotal)}</span></div>
        <div class="trow"><span class="muted">Versand (DHL)</span><span id="shipval">${needsShip ? EUR(SHIP.de) : 'kostenlos'}</span></div>
        <div class="trow grand"><span>Gesamt</span><span id="grandval">${EUR(itemsTotal + (needsShip ? SHIP.de : 0))}</span></div>
        <button class="paybtn" id="pay">zur zahlung · SumUp</button>
        <div class="paynote">Weiterleitung zu SumUp · Karte & Apple Pay</div>
      </div>
    </div>
  </div>`;

  const sel = document.querySelector('select[name=country]');
  const shipEl = document.getElementById('shipval'), grandEl = document.getElementById('grandval');
  function refresh(){
    if(!needsShip){ shipEl.textContent='kostenlos'; grandEl.textContent=EUR(itemsTotal); return; }
    const f = feeFor(sel.value);
    shipEl.textContent = f===null ? '—' : EUR(f);
    grandEl.textContent = f===null ? EUR(itemsTotal) : EUR(itemsTotal + f);
  }
  sel.addEventListener('change', refresh);

  const err = document.getElementById('formerr');
  function showErr(m){ err.textContent = m; err.style.display='block'; }
  function clearErr(){ err.style.display='none'; document.querySelectorAll('.field.err').forEach(f=>f.classList.remove('err')); }

  document.getElementById('pay').addEventListener('click', function(){
    clearErr();
    const form = document.getElementById('co');
    const d = Object.fromEntries(new FormData(form).entries());
    const required = needsShip ? ['email','firstName','lastName','street','plz','city','country'] : ['email'];
    let bad = required.filter(k => !((d[k]||'').trim()));
    if(!/^\S+@\S+\.\S+$/.test(d.email||'')) if(!bad.includes('email')) bad.push('email');
    if(bad.length){
      bad.forEach(k=>{ const el=form.querySelector(`[name=${k}]`); if(el) el.closest('.field').classList.add('err'); });
      showErr('Bitte fülle die markierten Pflichtfelder aus.');
      return;
    }
    if(needsShip){
      const fee = feeFor(d.country);
      if(fee===null){ showErr('Dieses Land beliefern wir aktuell nicht (nur DE & EU).'); return; }
    }

    const btn = document.getElementById('pay'); btn.disabled=true; btn.textContent='einen moment…';
    const items = cart.map(i=>({id:i.id,size:i.size,qty:i.qty}));
    fetch(OBOCart.checkoutUrl, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ items, shipping:{country:d.country}, customer:d })
    })
    .then(r=>r.json())
    .then(res=>{ if(res.checkout_url){ location.href = res.checkout_url; }
      else { showErr('Zahlung konnte nicht gestartet werden. Bitte erneut versuchen.'); btn.disabled=false; btn.textContent='zur zahlung · SumUp'; } })
    .catch(()=>{ showErr('Netzwerkfehler. Bitte erneut versuchen.'); btn.disabled=false; btn.textContent='zur zahlung · SumUp'; });
  });
})();
</script>
</body>
</html>
